[workspace]
resolver = "3"
members = ["crates/eep-core", "crates/eep", "crates/eep-build"]

[workspace.package]
version = "0.2.0-beta"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/prj786/eep"

[workspace.dependencies]
eep-core = { path = "crates/eep-core" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# TLS and zstd are unusably slow unoptimized; optimize dependencies in dev too.
[profile.dev.package."*"]
opt-level = 2
