# eep's server and channel for every user and for root's driver timer. A
# user's ~/.config/eep/config.toml wins over this file; EEP_SERVER and
# EEP_CHANNEL win over both.
server = "https://prj786.github.io/eep"
channel = "nixos-unstable"
# Give every app on the computer a card in ~/Applications (pacman's,
# AppImages, Steam games, your own launcher entries), not only eep's.
find_apps = true
