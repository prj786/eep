# eep: the local binary cache that patched update pieces go into (nix-daemon
# takes them from here before cache.nixos.org, and checks their signatures
# just the same). /etc/nix/nix.conf pulls this file in with the line
#   !include /etc/nix/eep.conf
# which the eep package adds on install and removes on uninstall.
extra-substituters = file:///var/cache/eep/local?priority=10
# A piece eep just put there must be found at once, not after a cached miss.
narinfo-cache-negative-ttl = 0
